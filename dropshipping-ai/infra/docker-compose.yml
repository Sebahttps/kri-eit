services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dropship
      POSTGRES_PASSWORD: dropship
      POSTGRES_DB: dropship
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  agents-service:
    build: ../apps/agents-service
    environment:
      AGENTS_DATABASE_URL: postgresql://dropship:dropship@postgres:5432/dropship
      AGENTS_REDIS_URL: redis://redis:6379/0
      AGENTS_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?definir en .env}
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

volumes:
  pgdata:
