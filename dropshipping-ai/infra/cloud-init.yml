#cloud-config
# Aprovisionamiento automático del VPS (Ubuntu 24.04).
#
# Pegar este archivo COMPLETO en el campo "User Data" / "Cloud-Init" del panel
# del proveedor (Vultr, Hetzner, DigitalOcean, etc.) al crear el servidor.
# Al primer arranque deja: Docker instalado, el repo clonado en /opt/kri-eit,
# los secretos de Postgres y JWT ya generados en .env.prod, y el firewall
# cerrado salvo SSH/80/443.
#
# Después, un único paso manual por SSH:
#   dropship-setup
# que pide la clave de Anthropic, los 3 dominios y el email ACME, levanta el
# stack completo y deja el cron de backups diarios.
#
# ANTES DE PEGARLO: reemplaza el marcador PEGA_AQUI_TU_LLAVE_PUBLICA en el
# bloque `runcmd` por tu llave pública real (el contenido de `~/.ssh/id_*.pub`).
# Sin eso el servidor arranca SIN NINGUNA FORMA DE ENTRAR: Vultr solo inyecta
# llaves elegidas en el momento de desplegar, y el panel no permite añadirlas
# después sin borrar el disco. Es exactamente lo que pasó el 2026-07-30.

hostname: compai-prod

# Por defecto cloud-init antepone un `command="..."` a la llave de root que
# rechaza la conexión con "Please login as...". Aquí root es la única cuenta
# que usa el despliegue, así que se desactiva esa protección; el acceso sigue
# siendo solo-por-llave porque la imagen trae PermitRootLogin prohibit-password.
disable_root: false
ssh_pwauth: false

package_update: true
packages:
  - git
  - curl
  - ufw
  - openssl

# Swap de 4 GB. No es para el runtime —el stack completo ronda 1 GB— sino
# para el pico de COMPILACIÓN: `up -d --build` construye cuatro imágenes y
# Compose las paraleliza, y cada build de Next.js puede pedir 1-2 GB. En un
# VPS de 4 GB eso es justo el momento en que el despliegue muere con un OOM
# poco descriptivo. El módulo `mounts` corre en la fase temprana de
# cloud-init, así que el swapfile ya existe cuando se instala Docker.
swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

write_files:
  - path: /etc/sysctl.d/99-dropship-swap.conf
    content: |
      # Red de seguridad, no sustituto de RAM: con swappiness bajo el kernel
      # recurre al swap solo bajo presión real y el runtime sigue en memoria.
      vm.swappiness=10

  - path: /usr/local/bin/dropship-setup
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Completa .env.prod (los secretos ya fueron generados por cloud-init),
      # levanta el stack de producción y programa los backups diarios.
      set -euo pipefail

      # Sin TTY, el primer `read` recibe EOF y devuelve != 0; con `set -e` eso
      # mata el script antes de la primera pregunta y casi sin mensaje, dejando
      # un servidor que parece configurado y no lo está. Pasa al invocarlo como
      # `ssh host dropship-setup`, sin `-t`. Se comprueba antes de tocar nada.
      if [ ! -t 0 ]; then
        echo "Esto necesita una terminal interactiva: pide la clave de Anthropic" >&2
        echo "y la contraseña del Supervisor." >&2
        echo >&2
        echo "  ssh -t root@<ip> dropship-setup" >&2
        echo >&2
        echo "El -t es lo que falta si llegaste aquí." >&2
        exit 1
      fi

      ENVF=/opt/kri-eit/dropshipping-ai/infra/.env.prod
      [ -f "$ENVF" ] || { echo "No existe $ENVF (¿terminó cloud-init? revisa /var/log/cloud-init-output.log)"; exit 1; }

      # ENTER conserva el valor actual y lo muestra entre corchetes. Asi lo que
      # no es secreto —los tres dominios y el email ACME— puede quedar escrito
      # en .env.prod de antemano, y el despliegue se reduce a teclear la clave
      # de Anthropic y la contraseña del Supervisor. Antes, contestar en blanco
      # borraba el valor en vez de conservarlo.
      ask() {
        local var=$1 prompt=$2 val cur
        cur=$(grep "^${var}=" "$ENVF" | cut -d= -f2-)
        if [ -n "$cur" ]; then
          read -rp "$prompt [$cur]: " val
          val=${val:-$cur}
        else
          read -rp "$prompt: " val
        fi
        sed -i "s|^${var}=.*|${var}=${val}|" "$ENVF"
      }

      echo "== Configuración del sistema de dropshipping =="
      ask ANTHROPIC_API_KEY "Clave API de Anthropic (sk-ant-...)"
      ask STORE_DOMAIN      "Dominio de la tienda propia (ej. hola.midominio.cl)"
      ask DASHBOARD_DOMAIN  "Dominio del panel (ej. panel.midominio.cl)"
      ask API_DOMAIN        "Dominio del gateway (ej. api.midominio.cl)"
      ask ACME_EMAIL        "Email para Let's Encrypt"

      # Credenciales del Supervisor. El seed lo deja BLOQUEADO porque el repo
      # es público y un hash bcrypt publicado se descifra sin conexión. Se piden
      # aquí para que fijarlas sea parte del despliegue y no un paso manual que
      # se olvida: hasta que esto corra, nadie puede entrar al panel.
      echo
      read -rp  "Correo de acceso al panel: " SUP_EMAIL
      read -rsp "Contraseña del Supervisor: " SUP_PASS; echo
      read -rsp "Repetir la contraseña: " SUP_PASS2; echo
      [ "$SUP_PASS" = "$SUP_PASS2" ] || { echo "Las contraseñas no coinciden."; exit 1; }
      [ ${#SUP_PASS} -ge 12 ] || { echo "Usa al menos 12 caracteres."; exit 1; }

      cd /opt/kri-eit/dropshipping-ai/infra
      docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

      DC="docker compose -f docker-compose.prod.yml --env-file .env.prod"

      echo "Esperando a PostgreSQL..."
      for _ in $(seq 1 60); do
        $DC exec -T postgres pg_isready -U dropship -d dropship >/dev/null 2>&1 && break
        sleep 2
      done

      # La contraseña viaja por variable de entorno y no por argumentos: argv es
      # visible en la lista de procesos del host, el entorno del contenedor no.
      SUP_HASH=$($DC exec -T -e PW="$SUP_PASS" business-api \
        node -e "console.log(require('bcryptjs').hashSync(process.env.PW,10))" | tr -d '\r')
      unset SUP_PASS SUP_PASS2

      $DC exec -T postgres psql -U dropship -d dropship -v ON_ERROR_STOP=1 \
        -c "UPDATE supervisors SET email='$SUP_EMAIL', password_hash='$SUP_HASH'
            WHERE id='00000000-0000-0000-0000-000000000001';" >/dev/null
      echo "Supervisor configurado: $SUP_EMAIL"

      mkdir -p /var/backups
      cat > /etc/cron.d/dropship-backup <<'CRON'
      30 3 * * * root cd /opt/kri-eit/dropshipping-ai/infra && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T postgres pg_dump -U dropship dropship | gzip > /var/backups/dropship-$(date +\%F).sql.gz && find /var/backups -name 'dropship-*.sql.gz' -mtime +14 -delete
      CRON

      echo
      echo "Stack levantado. Verifica con:"
      echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod ps"
      echo "y en unos minutos (emisión de certificados):"
      echo "  curl -I https://$(grep ^STORE_DOMAIN= "$ENVF" | cut -d= -f2)"

  - path: /usr/local/bin/dropship-health
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Autodiagnostico de CompAI. Corre por cron cada 10 minutos.
      #
      # Deja una linea de resumen en /var/log/dropship-health.log y el detalle del
      # ultimo chequeo en /var/log/dropship-health.last
      #
      # LIMITE CONOCIDO: esto corre DENTRO del servidor, asi que su punto ciego es
      # justamente el servidor caido, que por definicion no puede reportarse solo.
      # Es el complemento interno de un monitor externo, no su reemplazo.
      #
      # Sin `set -e` a proposito: un chequeo que falla no debe abortar los demas.
      # La gracia de un diagnostico es ver TODOS los sintomas, no solo el primero.
      set -uo pipefail

      INFRA=/opt/kri-eit/dropshipping-ai/infra
      LOG=/var/log/dropship-health.log
      LAST=/var/log/dropship-health.last
      DOMINIOS="hola.compai.cl panel.compai.cl api.compai.cl"
      SERVICIOS="postgres redis agents-service business-api dashboard store caddy"

      cd "$INFRA" 2>/dev/null || { echo "$(date -u '+%F %T') FALLA: no existe $INFRA" >> "$LOG"; exit 1; }
      DC="docker compose -f docker-compose.prod.yml --env-file .env.prod"

      # Entre el aprovisionamiento y el primer `dropship-setup` el stack no
      # existe todavia. Sin esta guarda el cron reportaria 7 contenedores
      # caidos cada 10 minutos por algo perfectamente esperado, y un monitor
      # que grita por lo esperado ensena a ignorarlo justo antes de que grite
      # por lo que importa. Se registra el estado y se sale en silencio.
      if ! grep -q '^ANTHROPIC_API_KEY=.' .env.prod 2>/dev/null; then
        echo "$(date -u '+%F %T') SIN DESPLEGAR (falta correr dropship-setup)" >> "$LOG"
        exit 0
      fi

      PROBLEMAS=()
      detalle()  { printf '%s\n' "$*" >> "$LAST.tmp"; }
      problema() { PROBLEMAS+=("$1"); detalle "  FALLA   $1"; }
      ok()       { detalle "  ok      $1"; }
      aviso()    { detalle "  aviso   $1"; }

      : > "$LAST.tmp"
      detalle "Chequeo $(date -u '+%F %T UTC')  ·  uptime$(uptime -p | sed 's/^up//')"
      detalle ""

      # --- contenedores ---
      ESTADOS=$($DC ps --format '{{.Service}} {{.State}}' 2>/dev/null)
      for s in $SERVICIOS; do
        if grep -qE "^$s running" <<< "$ESTADOS"; then ok "contenedor $s"
        else problema "contenedor $s no esta corriendo"; fi
      done

      # --- postgres acepta conexiones ---
      if $DC exec -T postgres pg_isready -U dropship -d dropship >/dev/null 2>&1; then
        ok "postgres acepta conexiones"
      else
        problema "postgres no acepta conexiones"
      fi

      # --- los dominios responden desde fuera ---
      for d in $DOMINIOS; do
        RUTA="/"; [ "$d" = "api.compai.cl" ] && RUTA="/health"
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$d$RUTA" 2>/dev/null)
        if [ "$CODE" = "200" ]; then ok "HTTP $d$RUTA -> 200"
        else problema "HTTP $d$RUTA -> $CODE"; fi
      done

      # --- vencimiento de los certificados ---
      # Caddy renueva a los 30 dias restantes; avisar bajo 15 significa que la
      # renovacion automatica ya fallo dos semanas seguidas y hay que mirar.
      for d in $DOMINIOS; do
        FIN=$(echo | timeout 10 openssl s_client -connect "$d:443" -servername "$d" 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
        if [ -z "$FIN" ]; then problema "TLS $d: no se pudo leer el certificado"; continue; fi
        DIAS=$(( ($(date -d "$FIN" +%s) - $(date +%s)) / 86400 ))
        if [ "$DIAS" -lt 15 ]; then problema "TLS $d vence en $DIAS dias"
        else ok "TLS $d vence en $DIAS dias"; fi
      done

      # --- disco y memoria ---
      USO=$(df --output=pcent / 2>/dev/null | tail -1 | tr -dc '0-9')
      if [ -n "$USO" ] && [ "$USO" -ge 85 ]; then problema "disco al ${USO}%"
      else ok "disco al ${USO:-?}%"; fi

      MEM=$(free 2>/dev/null | awk '/^Mem:/ {printf "%d", $3*100/$2}')
      if [ -n "$MEM" ] && [ "$MEM" -ge 90 ]; then problema "RAM al ${MEM}%"
      else ok "RAM al ${MEM:-?}%"; fi

      # --- el backup del dia se creo ---
      # El umbral es 26 h y no 24: da margen para que el cron de las 03:30 corra sin
      # que el chequeo de las 03:2x del dia siguiente lo declare atrasado.
      ULTIMO=$(ls -t /var/backups/dropship-*.sql.gz 2>/dev/null | head -1)
      if [ -z "$ULTIMO" ]; then
        aviso "aun no hay backups (el primero corre a las 03:30 UTC)"
      else
        HORAS=$(( ($(date +%s) - $(stat -c %Y "$ULTIMO")) / 3600 ))
        TAM=$(du -h "$ULTIMO" | cut -f1)
        if [ "$HORAS" -gt 26 ]; then problema "el ultimo backup tiene ${HORAS} h"
        else ok "backup de hace ${HORAS} h ($(basename "$ULTIMO"), $TAM)"; fi
      fi

      mv "$LAST.tmp" "$LAST"

      N=${#PROBLEMAS[@]}
      if [ "$N" -eq 0 ]; then
        echo "$(date -u '+%F %T') OK" >> "$LOG"
      else
        echo "$(date -u '+%F %T') FALLA($N): $(IFS='; '; echo "${PROBLEMAS[*]}")" >> "$LOG"
      fi

      # El log no puede crecer sin control: cada 10 min son ~4300 lineas al mes.
      tail -n 3000 "$LOG" > "$LOG.tmp" 2>/dev/null && mv "$LOG.tmp" "$LOG"

      [ "$N" -eq 0 ]

  - path: /etc/cron.d/dropship-health
    permissions: "0644"
    content: |
      # Autodiagnostico cada 10 minutos. El detalle del ultimo chequeo queda en
      # /var/log/dropship-health.last y el historico en dropship-health.log
      */10 * * * * root /usr/local/bin/dropship-health >/dev/null 2>&1

runcmd:
  # La llave va PRIMERO, antes de Docker y del clone. Si un paso posterior
  # falla —get.docker.com caído, el repo inaccesible— el servidor queda a
  # medio aprovisionar pero se puede entrar a diagnosticarlo. Al revés, un
  # fallo temprano deja el servidor inalcanzable y la única salida es borrarlo.
  # Va en runcmd y no en `users:` porque runcmd corre en la fase final, después
  # del módulo `ssh`, así que nada de cloud-init puede sobrescribir el archivo.
  - sh -c "mkdir -p /root/.ssh && chmod 700 /root/.ssh"
  - sh -c "echo 'PEGA_AQUI_TU_LLAVE_PUBLICA' >> /root/.ssh/authorized_keys"
  - sh -c "chmod 600 /root/.ssh/authorized_keys"
  - sysctl --system
  - curl -fsSL https://get.docker.com | sh
  # Rama explícita: sin --branch se clona la rama por defecto del repositorio,
  # que puede cambiar sin que nadie lo note y desplegaría código distinto del
  # esperado. Producción sale de main; el trabajo en curso vive en ramas.
  - git clone --branch main https://github.com/Sebahttps/kri-eit.git /opt/kri-eit
  - cp /opt/kri-eit/dropshipping-ai/infra/.env.prod.example /opt/kri-eit/dropshipping-ai/infra/.env.prod
  - sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" /opt/kri-eit/dropshipping-ai/infra/.env.prod
  - sed -i "s|^BUSINESS_JWT_SECRET=.*|BUSINESS_JWT_SECRET=$(openssl rand -hex 32)|" /opt/kri-eit/dropshipping-ai/infra/.env.prod
  - chmod 600 /opt/kri-eit/dropshipping-ai/infra/.env.prod
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
